function restOf(rd){return rd.r===null||rd.r===undefined?[]:(Array.isArray(rd.r)?rd.r:[rd.r])}
function isSet(mt){return mt.s!==null&&mt.s!==undefined}
function progress(t){var d=0,n=0;t.rounds.forEach(function(rd){rd.m.forEach(function(mt){n++;if(isSet(mt))d++})});return{d:d,t:n}}
function roundDone(rd){return rd.m.every(isSet)}
function standings(t){
  var G=t.games,rows=t.players.map(function(nm,i){return{i:i,name:nm,pts:0,pj:0,g:0,e:0,p:0,h:0}}),played=[];
  t.rounds.forEach(function(rd){rd.m.forEach(function(mt){
    if(!isSet(mt))return;
    var sa=mt.s,sb=G-mt.s;if(!mt.f)played.push({a:mt.a,b:mt.b,sa:sa,sb:sb});
    mt.a.forEach(function(i){var r=rows[i];r.pts+=sa;r.pj++;if(sa>sb)r.g++;else if(sa===sb)r.e++;else r.p++});
    if(!mt.f)mt.b.forEach(function(i){var r=rows[i];r.pts+=sb;r.pj++;if(sb>sa)r.g++;else if(sa===sb)r.e++;else r.p++});
  })});
  var groups={};rows.forEach(function(r){(groups[r.pts]=groups[r.pts]||[]).push(r)});
  Object.keys(groups).forEach(function(k){
    var grp=groups[k];if(grp.length<2)return;
    var tied={};grp.forEach(function(r){tied[r.i]=true});
    played.forEach(function(m){
      [['a','b','sa','sb'],['b','a','sb','sa']].forEach(function(sd){
        var mine=m[sd[0]],theirs=m[sd[1]],my=m[sd[2]],ot=m[sd[3]];
        if(!(tied[theirs[0]]||tied[theirs[1]]))return;
        mine.forEach(function(x){if(tied[x]){if(my>ot)rows[x].h++;else if(my<ot)rows[x].h--}});
      });
    });
  });
  rows.sort(function(x,y){return y.pts-x.pts||y.h-x.h||x.p-y.p||x.name.localeCompare(y.name,'es')});
  rows.forEach(function(r,k){var pr=rows[k-1];r.pos=(pr&&pr.pts===r.pts&&pr.h===r.h&&pr.p===r.p)?pr.pos:k+1});
  rows.forEach(function(r){
    var same=rows.filter(function(o){return o!==r&&o.pts===r.pts});
    if(!same.length)r.tag='';
    else if(same.some(function(o){return o.h===r.h&&o.p===r.p}))r.tag='empate';
    else if(same.some(function(o){return o.h===r.h}))r.tag='por perdidos';
    else r.tag='por directo';
  });
  return rows;
}

function buildDoc(st){
  var css=document.getElementById('app-css').textContent,js=document.getElementById('app-js').textContent;
  var json=JSON.stringify(st).replace(/</g,'\\u003c'),title=st&&st.cur&&st.cur.name?esc(st.cur.name):'Americano de pádel';
  return '<!doctype html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+title+'</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style id="app-css">'+css+'</style></head><body><div id="app"></div><'+S+' type="application/json" id="estado">'+json+'</'+S+'><'+S+' id="app-js">'+js+'</'+S+'></body></html>';
}
function saveScroll(){lsSet(SC_KEY,JSON.stringify({y:window.scrollY||window.pageYOffset||0,tab:ui.tab,j:ui.j,t:Date.now()}))}
function restoreScroll(){try{var s=JSON.parse(lsGet(SC_KEY));if(s&&Date.now()-s.t<600000&&s.tab===ui.tab&&s.j===ui.j&&s.y>0)window.scrollTo(0,s.y)}catch(e){}}
var scT=null;window.addEventListener('scroll',function(){clearTimeout(scT);scT=setTimeout(saveScroll,200)},{passive:true});

function publishNow(){
  if(!(mode==='live'&&artifactNs))return;
  clearTimeout(pubTimer);saving=true;saveScroll();renderStatus();
  artifactNs.publish(buildDoc(root)).then(function(){saving=false;pending=false;pubError=false;render()},function(e){
    saving=false;var c=e&&e.code;
    if(c==='not_granted'||c==='not_writer'){mode='readonly';root=embedded||emptyRoot()}
    else if(c!=='conflict')pubError=true;
    render();
  });
}
function commit(){
  root.upd=Date.now();if(root.cur)root.cur.upd=root.upd;
  lsSet(LS_KEY,JSON.stringify(root));
  if(mode==='live'&&artifactNs){saving=true;clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,1500)}
  render();
}

function statusHTML(){
  if(mode==='live')return saving?'<span class="status"><i class="dot busy"></i>Guardando…</span>':'<span class="status"><i class="dot live"></i>Los resultados se ven en el enlace compartido</span>';
  if(mode==='readonly')return '<span class="status"><i class="dot"></i>Solo lectura: el organizador captura los resultados</span>';
  return '<span class="status"><i class="dot"></i>Guardado en este teléfono</span>';
}
function renderStatus(){var el=document.getElementById('status');if(el)el.innerHTML=statusHTML()}
function bannerHTML(){
  if(mode!=='live'||saving||!(pending||pubError))return '';
  var msg=pubError?'No se pudieron publicar los últimos cambios. Están guardados en este teléfono.':'Este teléfono tiene cambios que todavía no aparecen en el enlace.';
  return '<div class="banner" role="status"><span>'+msg+'</span><button id="retry">Publicar ahora</button></div>';
}
function planHTML(n){
  if(n===0)return '<p class="hint">De 4 a 9 jugadores.</p>';
  if(n<4)return '<p class="hint bad">Faltan '+(4-n)+' para el mínimo de 4.</p>';
  var p=PLAN[n],t='<b>'+n+' jugadores:</b> '+p[0]+' jornadas de 2 partidos ('+p[1]+' partidos en total).';
  if(n<8)t+=' Los 2 partidos de cada jornada se juegan uno después del otro.';
  if(n===9)t+=' Cada quien descansa una jornada.';
  if(n===6||n===7)t+=' El último es un partido extra: la pareja que sobra juega contra dos de relleno, elegidos entre los que menos han jugado al final, y ellos ya no suman puntos.';
  return '<p class="hint good">'+t+'</p>';
}
function fmtDate(ms){try{return new Date(ms).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}}
function histHTML(canEdit){

    var pr=progress(t),rows=standings(t),top=rows.filter(function(r){return r.pos===1}).map(function(r){return r.name}).join(' y ');
    var st=pr.d===pr.t?'Ganó: '+esc(top):'Sin terminar ('+pr.d+' de '+pr.t+' partidos)';
    var btns=canEdit?'<div class="hbtns"><button class="btn ghost" data-open="'+k+'">Abrir</button><button class="btn ghost danger" data-hdel="'+k+'">'+(confirmKey==='h'+k?'¿Quitar?':'Quitar')+'</button></div>':'';
    return '<div class="hitem"><div><b>'+esc(t.name)+'</b><span class="hmeta">'+fmtDate(t.created)+'. '+st+'</span></div>'+btns+'</div>';
  }).join('');
  return '<section class="panel"><h2 class="ptitle">Torneos anteriores</h2>'+items+'</section>';
}

  '<section class="panel"><div class="field"><label for="tname">Nombre del torneo</label><input type="text" id="tname" maxlength="60" placeholder="Americano del sábado" value="'+esc(ui.draftName||'')+'"></div>'+

  '<div class="actions"><button class="btn block" id="create"'+(n>=4?'':' disabled')+'>Sortear y crear jornadas</button></div>'+histHTML(true);

    parts.forEach(function(p){if(lower.indexOf(p.toLowerCase())>=0)return;if(draftPlayers.length>=MAXP){overMsg=true;return}draftPlayers.push(p);lower.push(p.toLowerCase())});
    render();var f=document.getElementById('pname');if(f&&!f.disabled)f.focus();
  }
  document.getElementById('padd').onclick=addFrom;
  pn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addFrom()}});
  pn.addEventListener('paste',function(){setTimeout(function(){if(/[\n,;]/.test(pn.value))addFrom()},0)});
  document.getElementById('tname').oninput=function(e){ui.draftName=e.target.value;saveUI()};
  document.getElementById('tgames').oninput=function(e){ui.draftGames=e.target.value;saveUI()};
  app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){draftPlayers.splice(+b.dataset.del,1);render()}});
  document.getElementById('create').onclick=function(){
    var g=parseInt(document.getElementById('tgames').value,10);

    var players=shuffle(draftPlayers);
    root.cur={name:(document.getElementById('tname').value.trim()||'Americano de pádel').slice(0,60),games:g,players:players,rounds:schedule(players.length),created:Date.now()};
    ui={tab:'j',j:0};saveUI();draftPlayers=[];confirmKey=null;window.scrollTo(0,0);commit();

function bindHist(){
  app.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){
    var k=+b.dataset.open;root.cur=root.hist.splice(k,1)[0];ui={tab:'t',j:0};saveUI();confirmKey=null;window.scrollTo(0,0);commit();
  }});

    var k=+b.dataset.hdel;if(confirmKey!=='h'+k){confirmKey='h'+k;render();return}

function nmC(i){var s=T().players[i]||'',c=s.length>13?' class="xl"':(s.length>9?' class="l"':'');return '<span'+c+'>'+esc(s)+'</span>'}

function renderJornada(){
  var t=T(),R=t.rounds,j=Math.min(ui.j||0,R.length-1),rd=R[j],G=t.games,ro=mode==='readonly';
  var nav=R.map(function(r,k){return '<button data-j="'+k+'" class="'+(roundDone(r)?'done':'')+'" aria-current="'+(k===j)+'" aria-label="Jornada '+(k+1)+'">'+(k+1)+'</button>'}).join('');
  var ms=rd.m.map(function(mt,k){
    var set=isSet(mt),sa=set?mt.s:null,sb=set?G-mt.s:null,picks='';
    if(!ro){for(var a=G;a>=0;a--)picks+='<button data-m="'+k+'" data-s="'+a+'" aria-pressed="'+(sa===a)+'">'+a+'-'+(G-a)+'</button>';
      if(set)picks+='<button class="clear" data-m="'+k+'" data-s="x">Borrar</button>';picks='<div class="picks">'+picks+'</div>'}
    return '<article class="match"><div class="mtitle">'+(mt.f?'Partido extra':'Partido '+(k+1))+'</div>'+
      '<div class="court" role="img" aria-label="'+nmT(mt.a[0])+' y '+nmT(mt.a[1])+' contra '+nmT(mt.b[0])+' y '+nmT(mt.b[1])+(set?', resultado '+sa+' a '+sb:'')+'"><i class="svc l"></i><i class="svc r"></i><i class="ctr l"></i><i class="ctr r"></i><i class="net"></i>'+
      '<div class="side a'+(set&&sa>sb?' win':'')+'">'+nmC(mt.a[0])+nmC(mt.a[1])+'</div>'+

  var rs=restOf(rd),rest=rs.length?'<p class="rest">'+(rs.length>1?'Descansan: ':'Descansa: ')+'<b>'+rs.map(nmT).join(', ')+'</b></p>':'';

function renderTabla(){
  var t=T(),rows=standings(t),pr=progress(t);
  var body=rows.map(function(r){return '<tr class="'+(r.pos===1&&r.pts>0?'lead':'')+'"><td class="pos">'+r.pos+'</td><td class="name">'+esc(r.name)+(r.tag&&r.pts>0?'<span class="tie">'+r.tag+'</span>':'')+'</td><td class="pts">'+r.pts+'</td><td>'+r.pj+'</td><td>'+r.g+'</td><td>'+r.e+'</td><td>'+r.p+'</td></tr>'}).join('');
  return '<p class="hint" style="margin-top:14px">'+pr.d+' de '+pr.t+' partidos capturados</p><div class="progress"><i style="width:'+(pr.t?pr.d/pr.t*100:0)+'%"></i></div>'+
    '<div class="tablewrap"><table><thead><tr><th>#</th><th class="name">Jugador</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="hint">Pts: games sumados. PJ: partidos jugados. G, E, P: ganados, empatados y perdidos. Desempate: partido directo entre los empatados y, si sigue igual, menos partidos perdidos.</p>'+
    '<div class="actions"><button class="btn block" id="share">Compartir tabla por WhatsApp</button>'+(flashMsg?'<p class="hint good">'+esc(flashMsg)+'</p>':'')+

  var inputs=t.players.map(function(p,i){return '<input type="text" class="pinput" data-p="'+i+'" maxlength="'+NAME_MAX+'" value="'+esc(p)+'" aria-label="Jugador '+(i+1)+'">'}).join('');
  return '<section class="panel" style="margin-top:14px"><div class="field"><label for="sname">Nombre del torneo</label><input type="text" id="sname" maxlength="60" value="'+esc(t.name)+'"></div>'+
    '<div class="field"><label>Jugadores</label><p class="hint" style="margin:0 0 8px">Corrige un nombre o escribe el de quien entra en lugar de otro. La persona nueva se queda con los puntos y partidos de ese lugar.</p>'+inputs+'</div>'+
    '<div class="field"><label for="sgames">Games por partido (sumados)</label><input type="number" id="sgames" inputmode="numeric" min="1" max="20" value="'+t.games+'"'+(locked?' disabled':'')+'>'+(locked?'<p class="hint">Ya hay resultados capturados. Para cambiarlo, vuelve a sortear.</p>':'')+'</div>'+

}
function tableText(){
  var t=T(),rows=standings(t),pr=progress(t),s='🎾 '+t.name+'\n'+(pr.d===pr.t?'Tabla final':'Tabla ('+pr.d+' de '+pr.t+' partidos)')+'\n\n';
  rows.forEach(function(r){s+=r.pos+'. '+r.name+' — '+r.pts+' pts\n'});
  return s.trim();
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){flashMsg='Tabla copiada. Pégala en el grupo de WhatsApp.';shareText=null;render()},function(){shareText=txt;render()})}
  else{shareText=txt;render()}
}
function renderMain(){
  var t=T(),ro=mode==='readonly';
  if(ro&&ui.tab==='a')ui.tab='j';
  var tabs='<button role="tab" data-tab="j" aria-selected="'+(ui.tab==='j')+'">Jornadas</button><button role="tab" data-tab="t" aria-selected="'+(ui.tab==='t')+'">Tabla</button>'+(ro?'':'<button role="tab" data-tab="a" aria-selected="'+(ui.tab==='a')+'">Ajustes</button>');
  var body=ui.tab==='t'?renderTabla():(ui.tab==='a'&&!ro?renderAjustes():renderJornada());
  app.innerHTML='<header class="top"><h1>'+esc(t.name)+'</h1><p>'+t.players.length+' jugadores, '+t.rounds.length+' jornadas, '+t.games+' games sumados por partido</p><div id="status">'+statusHTML()+'</div></header>'+bannerHTML()+
    '<div class="tabs" role="tablist">'+tabs+'</div>'+body;
  flashMsg='';formError='';
  app.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){if(ui.tab!==b.dataset.tab){ui.tab=b.dataset.tab;saveUI();confirmKey=null;shareText=null;render();window.scrollTo(0,0)}}});
  if(ui.tab==='t'){
    document.getElementById('share').onclick=function(){
      var txt=tableText();
      if(navigator.share){navigator.share({text:txt}).catch(function(e){if(e&&e.name==='AbortError')return;copyText(txt)})}
      else copyText(txt);
    };
    var st=document.getElementById('sharetxt');if(st){st.focus();st.select()}
    var cp=document.getElementById('copytxt');if(cp)cp.onclick=function(){var el=document.getElementById('sharetxt');el.focus();el.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}if(ok){flashMsg='Tabla copiada. Pégala en el grupo de WhatsApp.';shareText=null;render()}else copyText(el.value)};
  }else if(ui.tab==='a'&&!ro){
    document.getElementById('ssave').onclick=function(){
      var names=[].map.call(app.querySelectorAll('.pinput'),function(el){return el.value.trim().slice(0,NAME_MAX)});
      if(names.some(function(x){return !x})){formError='Ningún jugador puede quedar sin nombre.';render();return}
      var low=names.map(function(x){return x.toLowerCase()});
      if(low.some(function(x,i){return low.indexOf(x)!==i})){formError='Hay dos jugadores con el mismo nombre.';render();return}
      var gEl=document.getElementById('sgames'),g=parseInt(gEl.value,10);

      t.name=(document.getElementById('sname').value.trim()||t.name).slice(0,60);t.players=names;if(!gEl.disabled)t.games=g;
      flashMsg='Cambios guardados.';commit();
    };
    document.getElementById('redraw').onclick=function(){
      if(progress(t).d>0&&confirmKey!=='redraw'){confirmKey='redraw';render();return}
      confirmKey=null;var names=shuffle(t.players);t.players=names;t.rounds=schedule(names.length);ui.j=0;ui.tab='j';saveUI();window.scrollTo(0,0);commit();
    };

      if(confirmKey!=='reset'){confirmKey='reset';render();return}
      confirmKey=null;root.hist.unshift(t);if(root.hist.length>HIST_MAX)root.hist.length=HIST_MAX;root.cur=null;
      draftPlayers=t.players.slice();ui={tab:'j',j:0,draftName:'',draftGames:t.games};saveUI();window.scrollTo(0,0);commit();
    };
  }else{
    app.querySelectorAll('[data-j]').forEach(function(b){b.onclick=function(){ui.j=+b.dataset.j;saveUI();render();window.scrollTo(0,0)}});
    var nav=app.querySelector('.jnav'),cur=app.querySelector('.jnav [aria-current=true]');
    if(nav&&cur)nav.scrollLeft=Math.max(0,cur.offsetLeft-nav.clientWidth/2+cur.clientWidth/2);

    document.getElementById('next').onclick=function(){ui.j=Math.min(t.rounds.length-1,(ui.j||0)+1);saveUI();render();window.scrollTo(0,0)};
    app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){
      var j=Math.min(ui.j||0,t.rounds.length-1),mt=t.rounds[j].m[+b.dataset.m],before=progress(t).d;
      mt.s=b.dataset.s==='x'?null:+b.dataset.s;
      var after=progress(t);if(after.d===after.t&&before<after.t){ui.tab='t';saveUI();window.scrollTo(0,0)}
      commit();
    }});
  }
}

if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(ns){
